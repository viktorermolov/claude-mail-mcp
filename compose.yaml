# claude-mail-mcp + Cloudflare Tunnel. No ports are published: the only
# way in is the tunnel, and cloudflared reaches the server over the
# private compose network.
#
#   docker compose up -d --build                 # server only
#   docker compose --profile tunnel up -d        # + tunnel (after Access is set up)

services:
  mail-mcp:
    build:
      context: .
      # Build steps use the host's resolver (some hosts only have IPv6 DNS
      # upstreams, which the default build network cannot reach).
      network: host
    image: claude-mail-mcp:local
    # Host user that owns ./secrets (see docs/DEPLOYMENT.md).
    user: "${MAILMCP_UID:?set MAILMCP_UID in .env}:${MAILMCP_GID:?set MAILMCP_GID in .env}"
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "3220"
      ACCOUNTS_FILE: /run/secrets/accounts.json
    volumes:
      - ./secrets:/run/secrets:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 384m
    pids_limit: 100
    restart: unless-stopped
    # Room for in-flight moves/draft updates to finish on shutdown (the
    # server drains for up to 15 s before closing IMAP).
    stop_grace_period: 20s
    networks: [mcp]
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:3220/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    profiles: [tunnel]
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    restart: unless-stopped
    networks: [mcp]
    depends_on:
      mail-mcp:
        condition: service_healthy

networks:
  mcp: {}
